[package]
name = "hsp-desktop"
version = "0.8.0"
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
hsp-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_WinRT", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
